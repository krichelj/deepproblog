# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unit tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: [self-hosted, linux]

    steps:
    - uses: actions/checkout@v2
    - name: Set up SWIPL
      # SWI-Prolog 8.4.3 built from source into a shared read-only prefix on each runner host
      run: |
        P=/scratch/jkrichel/own-runners/tools/swipl-8.4.3
        echo "$P/bin" >> "$GITHUB_PATH"
        echo "SWI_HOME_DIR=$P/lib/swipl" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$P/lib/swipl/lib/x86_64-linux${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
        "$P/bin/swipl" --version
    - name: Set up Python 3.9
      uses: actions/setup-python@v2
      with:
        python-version: 3.9
    - name: Install dependencies
      run: |
        git clone https://github.com/ML-KULeuven/pyswip.git
        pip install pyswip/
        python -m pip install --upgrade pip
        pip install pytest
        pip install .
    - name: Test with pytest
      run: |
        python -m deepproblog test
